name: Release

# Every push to main runs this workflow. Changesets decides what happens:
#   - Uncommitted changesets exist  → bot opens/updates a "Version Packages" PR
#   - "Version Packages" PR merged  → packages are published to npm and JSR
#
# ── Manual setup (one-time, before first publish) ─────────────────────────────
#
# npm
#   1. Create an Automation token at npmjs.com (Account → Access Tokens).
#   2. Add it as a repository secret: Settings → Secrets → Actions → NPM_TOKEN.
#   3. Ensure the @byrding scope exists on npm (create an org if needed).
#
# JSR  (no token needed — uses OIDC)
#   1. Create the @byrding scope at jsr.io.
#   2. Create each package: @byrding/core, @byrding/react, @byrding/vue.
#   3. For each package: Settings → GitHub Actions Publishing → Enable,
#      repository = nurmaso/byrding, branch = main.
#
# GitHub Actions permissions
#   Repo → Settings → Actions → General → Workflow permissions:
#     ✅ Read and write permissions
#     ✅ Allow GitHub Actions to create and approve pull requests
#
# ── Day-to-day workflow ───────────────────────────────────────────────────────
#
#   # After finishing a feature or fix:
#   pnpm changeset          # interactive: pick packages + bump level
#   git add .changeset/
#   git commit -m "chore: add changeset"
#   git push
#
#   # → CI creates/updates a "Version Packages" PR.
#   # Merge that PR → CI publishes the bumped packages to npm and JSR.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # changesets commits version bumps to main
  pull-requests: write   # changesets opens the "Version Packages" PR
  id-token: write        # npm provenance + JSR OIDC (no JSR secret needed)

jobs:
  # ── Job 1: publish to npm ────────────────────────────────────────────────────
  # changesets/action has two modes depending on repo state:
  #   • Pending changesets exist  → opens/updates a "Version Packages" PR (no publish)
  #   • "Version Packages" PR merged → runs `pnpm changeset publish` → npm
  # Both modes live in the same action; they cannot be split without custom scripting.
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so changesets can diff which packages changed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build


      - name: Create Version PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Job 2: publish to JSR (only when npm publish happened) ──────────────────
  publish-jsr:
    name: Publish to JSR
    needs: publish-npm
    if: needs.publish-npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # JSR OIDC — no JSR_TOKEN secret required

    steps:
      # Check out the version-bump commit that changesets just pushed to main
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build


      # Publishes only the packages changesets bumped; syncs jsr.json versions
      - name: Publish to JSR
        run: node scripts/publish-jsr.mjs
        env:
          PUBLISHED: ${{ needs.publish-npm.outputs.publishedPackages }}
